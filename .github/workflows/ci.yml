name: DevHub CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --workspaces --ignore-scripts

    - name: Generate Prisma Client
      run: cd packages/database && npx prisma generate

    - name: Lint
      run: |
        npm run lint --workspace=@devhub/api
        npm run lint --workspace=@devhub/web || true

    - name: Typecheck
      run: |
        npm run typecheck --workspace=@devhub/api
        npm run build --workspace=@devhub/web || true

    - name: Test
      run: npm test --workspaces --if-present

    - name: Build API
      run: npm run build --workspace=@devhub/api
